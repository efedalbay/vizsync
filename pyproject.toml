[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizsync"
dynamic = ["version"]
description = "Find where each paragraph of a script starts and ends in a narration recording."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pydantic>=2",
    "pyyaml",
    "rich",
]

[project.scripts]
vizsync = "vizsync.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.version]
path = "src/vizsync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vizsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: uses the real speech model and the fixture clip (needs a model download)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["vizsync.script.*", "vizsync.match.*", "vizsync.output.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
