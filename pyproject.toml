[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizsync"
dynamic = ["version"]
description = "Find where each paragraph of a script starts and ends in a narration recording."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Efe Dalbay" }]
requires-python = ">=3.11"
keywords = ["narration", "voice-over", "subtitles", "srt", "chapters", "youtube", "forced alignment", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer",
    "pydantic>=2",
    "pyyaml",
    "rich",
    "rapidfuzz>=3",
    "faster-whisper>=1",
    # faster-whisper 1.2 opens audio with an argument that PyAV 19 removed.
    "av>=12,<19",
]

[project.urls]
Homepage = "https://github.com/efedalbay/vizsync"
Documentation = "https://github.com/efedalbay/vizsync/blob/main/docs/SPEC.md"
Issues = "https://github.com/efedalbay/vizsync/issues"
Changelog = "https://github.com/efedalbay/vizsync/blob/main/CHANGELOG.md"

[project.scripts]
vizsync = "vizsync.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.version]
path = "src/vizsync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vizsync"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: uses the real speech model and the fixture clip (needs a model download)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "ctranslate2", "yaml"]
ignore_missing_imports = true

# PyAV's types refer to numpy's, whose stubs use Python 3.12 syntax that mypy rejects when it
# checks for 3.11. vizsync does not use numpy, so mypy does not follow into it.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["vizsync.script.*", "vizsync.match.*", "vizsync.output.*", "vizsync.integrations.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
